<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>

<body>
  <div class="container-form">
    <form action="">
      <h1 class="contactUs">Contact Us</h1>
      <div class="personal-information">
        <!-- Nombre y Apellidos-->
        <div class="information">
          <div class="name-information">
            <label for="name">First Name<span class="span">*</span></label>
            <input type="text" required class="name-input">
          </div>
          <div class="lastName-information">
            <label for="lastName">Last Name<span class="span">*</span></label>
            <input type="text" required class="lastName-input">
          </div>
        </div>


        <!-- Email -->
        <div class="email">
          <label for="email-address">Email Address<span class="span">*</span></label>
          <input type="email" required class="email-input">
        </div>

        <!-- Query -->
        <div class="query-container">
          <p>Query Type<span class="span">*</span></p>
          <div class="opciones-query">
            <article class="opcion1">
              <input type="radio" id="General" name="queryType" class="query-general" required>
              <label for="General">General Enquiry</label>
            </article>

            <article class="opcion2">
              <input type="radio" id="Support" name="queryType" class="query-support" required>
              <label for="Support">Support Request</label>
            </article>
          </div>
        </div>

        <!-- Message -->
        <div class="message-div">
          <p>Message<span class="span">*</span></p>
          <textarea class="message" required></textarea>
        </div>

        <!-- Concentimiento checkbox -->
        <div class="checkbox-container">
          <div class="checkbox">
            <input type="checkbox" required >
            <p for="marqueAqui" id="marqueAqui">I consent to being contacted by the team<span class="span">*</span></p>
          </div>
          

        </div>

        <!-- submit -->
        <button type="submit" class="submit-button">Submit</button>
      </div>

    </form>
  </div>

  <script src="./index.js"></script>
</body>

</html>
